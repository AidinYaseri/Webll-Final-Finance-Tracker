version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: finance-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-server
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/finance_tracker
      JWT_SECRET: your_secure_jwt_secret_key_change_this_in_production
      PORT: 5000
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finance-network
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finance-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - finance-network
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://server:5000/api

volumes:
  postgres_data:

networks:
  finance-network:
    driver: bridge
